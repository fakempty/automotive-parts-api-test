name: Lab 9 - CI/CD and Continuous Testing

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Simulate intentional failure to demonstrate failed pipeline"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  JAVA_VERSION: "21"
  SIMULATE_FAILURE: ${{ inputs.simulate_failure || 'false' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build AutoApiTesting
        working-directory: AutoApiTesting
        run: chmod +x ./mvnw && ./mvnw -B clean test-compile

      - name: Compile regression-lab8 test suite
        if: hashFiles('regression-lab8/pom.xml') != ''
        working-directory: regression-lab8
        run: mvn -B test-compile

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit tests in AutoApiTesting
        working-directory: AutoApiTesting
        run: chmod +x ./mvnw && ./mvnw -B test

      - name: Upload unit test reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: AutoApiTesting/target/surefire-reports/
          if-no-files-found: warn

  integration-api-tests:
    name: Integration & API Tests
    needs: [build, unit-tests]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: autoparts
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/autoparts
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run service, API check, and regression suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lab9-artifacts

          cd AutoApiTesting
          chmod +x ./mvnw
          ./mvnw -B spring-boot:run -Dspring-boot.run.arguments="--server.port=8080" > ../lab9-artifacts/app.log 2>&1 &
          APP_PID=$!
          cd ..

          cleanup() {
            if kill -0 "$APP_PID" 2>/dev/null; then
              kill "$APP_PID" || true
              wait "$APP_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          echo "Waiting for AutoApiTesting on http://localhost:8080..."
          READY=0
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/parts || true)
            if [[ "$STATUS" =~ ^(200|401|403|404)$ ]]; then
              echo "Service responded with HTTP $STATUS on attempt $i"
              READY=1
              break
            fi
            sleep 2
          done

          if [[ "$READY" -ne 1 ]]; then
            echo "Service did not start in time. App log:"
            cat lab9-artifacts/app.log || true
            exit 1
          fi

          API_RAW=$(curl -s -w "\n%{http_code}" http://localhost:8080/api/parts)
          API_CODE=$(echo "$API_RAW" | tail -n1)
          API_BODY=$(echo "$API_RAW" | sed '$d')
          echo "GET /api/parts -> HTTP $API_CODE"
          echo "$API_BODY" > lab9-artifacts/api-parts.json

          if [[ "$API_CODE" -ne 200 ]]; then
            echo "Expected HTTP 200 from /api/parts, got $API_CODE"
            exit 1
          fi

          if [[ -f "regression-lab8/pom.xml" ]]; then
            mvn -B -f regression-lab8/pom.xml test -Dtest=PartsRegressionSuiteTest -Dsut.baseUrl=http://localhost:8080 | tee lab9-artifacts/regression-suite.log
            cp -r regression-lab8/target/surefire-reports lab9-artifacts/surefire-reports 2>/dev/null || true
          fi

          if [[ "${SIMULATE_FAILURE}" == "true" ]]; then
            echo "::error::Intentional failure triggered (SIMULATE_FAILURE=true) for Lab 9 failed pipeline demo"
            echo "FAILED: Intentional test failure in Integration & API Tests" > lab9-artifacts/status.txt
            exit 1
          fi

          echo "PASSED: Integration & API Tests completed successfully" > lab9-artifacts/status.txt

      - name: Upload integration & API artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-api-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab9-artifacts/
          if-no-files-found: warn